[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-tecnospeed"
version = "0.1.0"
description = "Servidor MCP local para consultar a documentação técnica pública da TecnoSpeed (Zendesk Help Center)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "mcp==2.3.0",
    "httpx2>=2.16,<3",
    "pydantic>=2.12,<3",
    "markdownify>=1.2,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.4",
    "ruff>=0.9",
]

[project.scripts]
mcp-tecnospeed = "mcp_tecnospeed.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_tecnospeed"]

# A cópia empacotada é o fallback para instalações sem o diretório do projeto.
# `config/products.json` continua sendo a fonte editável no repositório.
[tool.hatch.build.targets.wheel.force-include]
"config/products.json" = "mcp_tecnospeed/products.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not integration'"
markers = [
    "integration: testes que acessam a API real do Zendesk (executar manualmente)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
